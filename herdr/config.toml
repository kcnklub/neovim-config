onboarding = false
# Mirrors ~/.config/tmux/tmux.conf (itself a port of the old Ghostty hotkeys)
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane

[theme]
# Fixed Everforest Dark (medium) palette now, not the terminal's own ANSI colors -
# every token below is overridden so the base name just has to be a valid fallback
name = "gruvbox"

[theme.custom]
# Everforest by sainnhe (https://github.com/sainnhe/everforest), mapped to herdr's
# tokens via thohemp/herdr-everforest (https://github.com/thohemp/herdr-everforest)
accent        = "#a7c080"
panel_bg      = "#2d353b"
sidebar_bg    = "#232a2e"
active_row_bg = "#3d484d"
selection_bg  = "#475258"
surface0      = "#343f44"
surface1      = "#3d484d"
surface_dim   = "#232a2e"
overlay0      = "#7a8478"
overlay1      = "#859289"
text          = "#d3c6aa"
subtext0      = "#9da9a0"
mauve         = "#d699b6"
green         = "#a7c080"
yellow        = "#dbbc7f"
red           = "#e67e80"
blue          = "#7fbbb3"
teal          = "#83c092"
peach         = "#e69875"

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[keys]
# ctrl+w is the tmux "ghostty" key table leader (bind -n C-w switch-client -T ghostty).
# Panes used to live under it as v/s/h/j/k/l, so herdr's prefix takes its place.
# ctrl+w ctrl+w sends a literal ctrl+w through to the pane (readline delete-word).
prefix = "ctrl+w"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"
# herdr's default prefix+s is split_horizontal here
settings = "prefix+shift+s"

# Copy mode
copy_mode = "prefix+["

# Panes - ctrl+w then v/s to split, h/j/k/l to focus, like the tmux key table
split_vertical = ["prefix+v", "alt+shift+enter"]
split_horizontal = ["prefix+s", "alt+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

focus_pane_left = ["prefix+h", "ctrl+alt+left"]
focus_pane_down = ["prefix+j", "ctrl+alt+down"]
focus_pane_up = ["prefix+k", "ctrl+alt+up"]
focus_pane_right = ["prefix+l", "ctrl+alt+right"]

resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# Like resize-pane on C-M-S-arrows
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous workspace
rename_pane = "prefix+shift+o"

# Windows -> tabs
# ctrl+t/ctrl+n/ctrl+p are prefix-less, matching tmux's bind -n C-t/C-n/C-p.
# Like there, they are swallowed from panes (no shell history on ctrl+n/ctrl+p).
new_tab = ["ctrl+t", "prefix+c"]
rename_tab = "prefix+r"
# prefix+k is focus_pane_up now; & is tmux's own kill-window
close_tab = "prefix+ampersand"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["ctrl+p", "prefix+p", "alt+left"]
next_tab = ["ctrl+n", "prefix+n", "alt+right"]

# Like swap-window -t -1/+1 on M-S-Left/Right
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

# Agents - no tmux equivalent; jump straight to an agent pane from anywhere.
# ctrl+alt+n/p continue the ctrl+alt+<arrows> pane-focus family and repeat without
# re-entering prefix mode; prefix+a / prefix+shift+a do the same under the leader.
next_agent = ["ctrl+alt+n", "prefix+a"]
previous_agent = ["ctrl+alt+p", "prefix+shift+a"]
focus_agent = "ctrl+alt+1..9"

# Projects - fuzzy-find a dir in ~/projects and focus or create its workspace
# (project-picker plugin: ~/projects/herdr-project-picker)
[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin pane open --plugin project-picker --entrypoint pick"

[ui]

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# status-right had the zoom flag followed by #h
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"
agent_panel_sort = "spaces"
